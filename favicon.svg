<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#C29D26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#E8C547" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#080808"/>
  <!-- Gold Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9"/>
  <!-- OP Monogram Geometric Vector Shapes -->
  <g filter="url(#glow)">
    <!-- O Shape -->
    <rect x="12" y="17" width="18" height="30" rx="9" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
    <!-- P Shape -->
    <path d="M 36 47 V 17 H 45 A 7.5 7.5 0 0 1 45 32 H 36" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>