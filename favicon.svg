<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#C29D26"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#080808"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  <!-- OP Monogram -->
  <text x="32" y="42" font-family="'Syne', 'Outfit', sans-serif" font-size="26" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">OP</text>
</svg>
